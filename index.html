<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cellular Automata Simulator</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<div class="main-layout">
		
		<div class="panel col-settings">
			<h3>Configuration</h3>
			
			<div class="control-group">
				<label for="gridSize">Grid Size</label>
				<input type="number" id="gridSize" value="20">
			</div>
			
			<div class="control-group">
				<label for="numStates">States (Max 11)</label>
				<input type="number" id="numStates" value="2" min="2" max="11">
			</div>

			<div class="control-group">
				<label for="boundary">Boundary Conditions</label>
				<select id="boundary">
					<option value="periodic">Cyclic (Toroidal)</option>
					<option value="finite">Finite (Dead Borders)</option>
				</select>
			</div>

			<div class="control-group">
				<label for="neighborhood">Neighborhood</label>
				<select id="neighborhood">
					<option value="moore">Moore (3x3)</option>
					<option value="von_neumann">Von Neumann (Cross)</option>
				</select>
			</div>

			<button id="btnInit" class="btn">Reset & Apply Settings</button>

			<hr>
			
			<h3>State Symbols</h3>
			<p class="description">Customize char (max 2).</p>
			<div id="symbolTableContainer" class="symbol-table"> </div>
			<button id="btnAddState" class="btn btn-success">+ Add State</button>
		</div>

		<div class="panel col-rules">
			<h3>Rule Builder</h3>

			<div class="mode-toggle">
				<label>
					<input type="checkbox" id="chkSelectFirst">
					Select cell first (Grid &rarr; Palette / Keyboard)
				</label>
				<p class="mode-hint">Keyboard: type symbol/digit, arrows to move, Delete/Backspace for '?' (0 on grid).</p>
			</div>
			
			<p class="description">1. Select Tool (State or '?')</p>
			<div id="paletteContainer" class="palette-grid"></div>

			<hr>

			<p class="description">2. Draw Pattern & Result</p>
			<div class="rule-editor">
				<div id="inputGrid" class="mini-grid"></div>
				
				<div class="result-container">
					<label>Result:</label>
					<div id="ruleResultDisplay" class="cell-display"></div>
				</div>
				
				<button id="btnAddRule" class="btn btn-success">Add Rule</button>
			</div>

			<hr>
		</div>

		<div class="panel col-sim">
			<h3>Simulation</h3>
			<canvas id="simCanvas"></canvas>
			
			<div class="action-buttons">
				<button id="btnStartStop" class="btn">Start/Stop</button>
				<button id="btnStepBack" class="btn" disabled>Step Back</button>
				<button id="btnStep" class="btn">Step</button>
			</div>
			<div class="action-buttons">
				<button id="btnRestart" class="btn btn-warning">Restart</button>
				<button id="btnClear" class="btn btn-danger">Clear Grid</button>
			</div>
			<hr>
			<div class="export-controls">
				<label for="exportSteps">Export Steps (0 to N):</label>
				<div class="export-row">
					<input type="number" id="exportSteps" value="5" min="0" max="100">
					<button id="btnExportPdf" class="btn btn-success">Export PDF</button>
				</div>
			</div>
		</div>

		<div class="panel col-active-rules">
			<h3>Active Rules</h3>
			<div id="ruleListContainer" class="rule-list"></div>
		</div>

	</div>
	
	<div id="printReport" class="print-only"></div>
	<script src="script.js"></script>
</body>
</html>
